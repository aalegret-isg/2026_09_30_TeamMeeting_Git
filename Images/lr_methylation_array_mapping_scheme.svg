<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title desc">
  <title id="title">Long-read methylation data mapped to Illumina CpGs</title>
  <desc id="desc">Simple horizontal workflow from long-read methylation table to Illumina CpG mapping, sample merging, harmonization and downstream analysis.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f4c81" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.2" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#0f4c81"/>
    </marker>
    <linearGradient id="tableGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf3f8"/>
      <stop offset="1" stop-color="#fff8f3"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="260" fill="#ffffff"/>

  <g font-family="Aptos, Segoe UI, Arial, sans-serif">
    <!-- Step 1 -->
    <g transform="translate(58 44)" filter="url(#shadow)">
      <rect width="210" height="150" rx="8" fill="url(#tableGrad)" stroke="#d9e3ea"/>
      <rect width="210" height="34" rx="8" fill="#0f4c81"/>
      <text x="18" y="23" font-size="15" font-weight="850" fill="#ffffff">1. LR methylation table</text>
      <g transform="translate(25 56)" stroke="#c8d8e4" stroke-width="1.5">
        <rect width="160" height="78" rx="4" fill="#ffffff"/>
        <line x1="0" y1="20" x2="160" y2="20"/>
        <line x1="0" y1="40" x2="160" y2="40"/>
        <line x1="0" y1="60" x2="160" y2="60"/>
        <line x1="49" y1="0" x2="49" y2="78"/>
        <line x1="98" y1="0" x2="98" y2="78"/>
      </g>
      <text x="30" y="73" font-size="10.5" font-weight="800" fill="#0f4c81">chr</text>
      <text x="80" y="73" font-size="10.5" font-weight="800" fill="#0f4c81">pos</text>
      <text x="128" y="73" font-size="10.5" font-weight="800" fill="#0f4c81">mod_sc</text>
      <text x="30" y="96" font-size="11" fill="#5d6978">chr1</text>
      <text x="80" y="96" font-size="11" fill="#5d6978">10468</text>
      <text x="128" y="96" font-size="11" fill="#f26b1d">0.82</text>
      <text x="30" y="116" font-size="11" fill="#5d6978">chr1</text>
      <text x="80" y="116" font-size="11" fill="#5d6978">10542</text>
      <text x="128" y="116" font-size="11" fill="#00a3a6">0.18</text>
      <text x="30" y="136" font-size="11" fill="#5d6978">chr2</text>
      <text x="80" y="136" font-size="11" fill="#5d6978">81201</text>
      <text x="128" y="136" font-size="11" fill="#f26b1d">0.64</text>
    </g>

    <line x1="287" y1="119" x2="333" y2="119" stroke="#0f4c81" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(360 44)" filter="url(#shadow)">
      <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#d9e3ea"/>
      <rect width="220" height="34" rx="8" fill="#f26b1d"/>
      <text x="18" y="23" font-size="15" font-weight="850" fill="#ffffff">2. Map to Illumina CpGs</text>
      <g transform="translate(30 62)">
        <line x1="0" y1="39" x2="160" y2="39" stroke="#1f2933" stroke-width="3"/>
        <g fill="#0f4c81" stroke="#0f4c81" stroke-width="2">
          <line x1="23" y1="39" x2="23" y2="15"/>
          <circle cx="23" cy="13" r="6" fill="#ffffff"/>
          <line x1="82" y1="39" x2="82" y2="66"/>
          <circle cx="82" cy="68" r="6" fill="#ffffff"/>
          <line x1="141" y1="39" x2="141" y2="15"/>
          <circle cx="141" cy="13" r="6" fill="#ffffff"/>
        </g>
        <g fill="#f26b1d">
          <rect x="43" y="29" width="24" height="20" rx="3"/>
          <rect x="104" y="29" width="24" height="20" rx="3"/>
        </g>
      </g>
    </g>

    <line x1="599" y1="119" x2="645" y2="119" stroke="#0f4c81" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(672 44)" filter="url(#shadow)">
      <rect width="205" height="150" rx="8" fill="#ffffff" stroke="#d9e3ea"/>
      <rect width="205" height="34" rx="8" fill="#00a3a6"/>
      <text x="18" y="23" font-size="15" font-weight="850" fill="#ffffff">3. Merge samples</text>
      <g transform="translate(42 60)">
        <rect width="120" height="82" rx="5" fill="#f8fafc" stroke="#c8d8e4"/>
        <line x1="0" y1="27" x2="120" y2="27" stroke="#c8d8e4"/>
        <line x1="0" y1="54" x2="120" y2="54" stroke="#c8d8e4"/>
        <line x1="40" y1="0" x2="40" y2="82" stroke="#c8d8e4"/>
        <line x1="80" y1="0" x2="80" y2="82" stroke="#c8d8e4"/>
        <rect x="9" y="9" width="23" height="10" fill="#00a3a6" opacity="0.9"/>
        <rect x="49" y="9" width="23" height="10" fill="#f26b1d" opacity="0.8"/>
        <rect x="89" y="9" width="23" height="10" fill="#0f4c81" opacity="0.8"/>
        <rect x="9" y="36" width="23" height="10" fill="#f26b1d" opacity="0.75"/>
        <rect x="49" y="36" width="23" height="10" fill="#0f4c81" opacity="0.72"/>
        <rect x="89" y="36" width="23" height="10" fill="#00a3a6" opacity="0.85"/>
        <rect x="9" y="63" width="23" height="10" fill="#0f4c81" opacity="0.76"/>
        <rect x="49" y="63" width="23" height="10" fill="#00a3a6" opacity="0.76"/>
        <rect x="89" y="63" width="23" height="10" fill="#f26b1d" opacity="0.85"/>
      </g>
    </g>

    <line x1="896" y1="119" x2="942" y2="119" stroke="#0f4c81" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <g transform="translate(969 44)" filter="url(#shadow)">
      <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#d9e3ea"/>
      <rect width="220" height="34" rx="8" fill="#62bb1f"/>
      <text x="18" y="23" font-size="15" font-weight="850" fill="#ffffff">4. Harmonize + filter</text>
      <g transform="translate(40 60)" fill="none" stroke-linecap="round" stroke-width="5">
        <path d="M0 30 H58" stroke="#d9e3ea"/>
        <path d="M0 30 H38" stroke="#0f4c81"/>
        <circle cx="38" cy="30" r="7" fill="#ffffff" stroke="#0f4c81" stroke-width="3"/>
        <path d="M0 72 H58" stroke="#d9e3ea"/>
        <path d="M0 72 H48" stroke="#f26b1d"/>
        <circle cx="48" cy="72" r="7" fill="#ffffff" stroke="#f26b1d" stroke-width="3"/>
        <path d="M95 22 L117 44 L156 5" stroke="#62bb1f"/>
        <path d="M95 72 L112 89 L157 44" stroke="#62bb1f"/>
      </g>
    </g>

    <line x1="1208" y1="119" x2="1254" y2="119" stroke="#0f4c81" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <g transform="translate(1280 44)" filter="url(#shadow)">
      <rect width="95" height="150" rx="8" fill="#ffffff" stroke="#d9e3ea"/>
      <rect width="95" height="34" rx="8" fill="#0f4c81"/>
      <text x="12" y="23" font-size="15" font-weight="850" fill="#ffffff">5. Analyze</text>
      <g transform="translate(16 61)">
        <line x1="0" y1="72" x2="64" y2="72" stroke="#1f2933" stroke-width="2"/>
        <line x1="0" y1="72" x2="0" y2="5" stroke="#1f2933" stroke-width="2"/>
        <circle cx="15" cy="52" r="5" fill="#00a3a6"/>
        <circle cx="28" cy="41" r="5" fill="#00a3a6"/>
        <circle cx="43" cy="31" r="5" fill="#f26b1d"/>
        <circle cx="57" cy="19" r="7" fill="#f26b1d"/>
        <path d="M10 59 C24 48 38 35 61 20" fill="none" stroke="#0f4c81" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>