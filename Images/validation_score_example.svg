<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Validation score summary</title>
  <desc id="desc">Illustrative validation outputs show case probability by diagnosis and ROC statistics.</desc>
  <style>.panel{fill:#fff;stroke:#d9e3ea;stroke-width:2}.head{font:800 22px Segoe UI,Arial;fill:#0f4c81}.txt{font:700 15px Segoe UI,Arial;fill:#1f2933}.muted{font:700 13px Segoe UI,Arial;fill:#5d6978}.axis{stroke:#1f2933;stroke-width:2}.thr{stroke:#62bb1f;stroke-width:3;stroke-dasharray:8 8}.ptc{fill:#0f4c81;opacity:.55}.ptk{fill:#f26b1d;opacity:.8}.roc{fill:none;stroke:#00a3a6;stroke-width:5}.diag{stroke:#8aa0b3;stroke-dasharray:6 6;stroke-width:2}</style>
  <rect x="34" y="48" width="620" height="310" rx="14" class="panel"/>
  <text x="62" y="84" class="head">Probability scores</text>
  <line x1="92" y1="306" x2="602" y2="306" class="axis"/><line x1="92" y1="306" x2="92" y2="108" class="axis"/>
  <line x1="92" y1="206" x2="602" y2="206" class="thr"/><text x="104" y="198" class="muted">0.5 threshold</text>
  <text x="132" y="332" class="muted">Control</text><text x="270" y="332" class="muted">Other cases</text><text x="470" y="332" class="muted">Target</text>
  <circle cx="145" cy="282" r="7" class="ptc"/><circle cx="168" cy="270" r="7" class="ptc"/><circle cx="187" cy="292" r="7" class="ptc"/><circle cx="205" cy="256" r="7" class="ptc"/>
  <circle cx="305" cy="264" r="7" class="ptc"/><circle cx="330" cy="236" r="7" class="ptc"/><circle cx="355" cy="286" r="7" class="ptc"/><circle cx="380" cy="248" r="7" class="ptc"/>
  <circle cx="500" cy="142" r="8" class="ptk"/><circle cx="525" cy="128" r="8" class="ptk"/><circle cx="548" cy="168" r="8" class="ptk"/><circle cx="572" cy="118" r="8" class="ptk"/>
  <text x="62" y="386" class="muted">Saved as validation plots and disease_score_list*.xlsx</text>

  <rect x="706" y="48" width="330" height="310" rx="14" class="panel"/>
  <text x="734" y="84" class="head">Summary metrics</text>
  <line x1="756" y1="306" x2="984" y2="306" class="axis"/><line x1="756" y1="306" x2="756" y2="108" class="axis"/>
  <line x1="756" y1="306" x2="984" y2="108" class="diag"/>
  <path d="M756 306 C784 202 836 144 984 112" class="roc"/>
  <text x="782" y="138" class="txt">AUC if true cases exist</text>
  <text x="782" y="178" class="muted">otherwise report false positives</text>
  <text x="782" y="222" class="muted">n tested, n controls, TPR, FPR</text>
  <text x="782" y="264" class="muted">SummaryValidationStatistics_*.xlsx</text>
</svg>
