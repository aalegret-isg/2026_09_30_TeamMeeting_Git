<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic episignature pipeline</title>
  <desc id="desc">Workflow from published CpGs to synthetic profiles, model training, validation and deployment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f4c81"/></marker>
    <style>
      .box{fill:#f6f7f9;stroke:#d9e3ea;stroke-width:2;rx:14}.head{font:800 24px Segoe UI,Arial;fill:#0f4c81}.txt{font:700 15px Segoe UI,Arial;fill:#1f2933}.muted{font:700 13px Segoe UI,Arial;fill:#5d6978}.tag{fill:#fff1e8;stroke:#f5c4a5}.tagtxt{font:800 12px Segoe UI,Arial;fill:#b94b0b}.arrow{stroke:#0f4c81;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="30" y="36" width="180" height="132" class="box"/>
  <text x="55" y="76" class="head">1. CpGs</text>
  <text x="55" y="107" class="txt">epis_list_CpG</text>
  <text x="55" y="130" class="muted">id, deltaBeta,</text>
  <text x="55" y="150" class="muted">PMID, cohort</text>
  <rect x="55" y="178" width="132" height="28" class="tag" rx="14"/><text x="71" y="197" class="tagtxt">v5_GetCpGs.R</text>

  <path d="M 218 102 L 278 102" class="arrow"/>
  <rect x="290" y="36" width="190" height="132" class="box"/>
  <text x="315" y="76" class="head">2. Controls</text>
  <text x="315" y="107" class="txt">Beta parameters</text>
  <text x="315" y="130" class="muted">alpha, beta, n</text>
  <text x="315" y="150" class="muted">pooled per CpG</text>
  <rect x="315" y="178" width="108" height="28" class="tag" rx="14"/><text x="331" y="197" class="tagtxt">FUNCTIONS.R</text>

  <path d="M 488 102 L 548 102" class="arrow"/>
  <rect x="560" y="36" width="205" height="132" class="box"/>
  <text x="585" y="76" class="head">3. Synthetic</text>
  <text x="585" y="107" class="txt">Apply delta beta</text>
  <text x="585" y="130" class="muted">target CpGs shifted,</text>
  <text x="585" y="150" class="muted">other CpGs background</text>
  <rect x="585" y="178" width="148" height="28" class="tag" rx="14"/><text x="601" y="197" class="tagtxt">v5_GenerateData.R</text>

  <path d="M 772 102 L 832 102" class="arrow"/>
  <rect x="845" y="36" width="255" height="132" class="box"/>
  <text x="870" y="76" class="head">4. Models</text>
  <text x="870" y="107" class="txt">SVM, RF, ENET, KNN, NN</text>
  <text x="870" y="130" class="muted">binary disease-vs-all</text>
  <text x="870" y="150" class="muted">or multiclass classifier</text>
  <rect x="870" y="178" width="175" height="28" class="tag" rx="14"/><text x="886" y="197" class="tagtxt">SingleModel / MultiModel</text>

  <rect x="200" y="260" width="230" height="96" class="box"/>
  <text x="225" y="298" class="head">Imprinted cases</text>
  <text x="225" y="329" class="muted">regions -> CpGs -> region scores</text>
  <path d="M 910 170 C 840 250 600 268 438 304" class="arrow"/>

  <rect x="520" y="260" width="230" height="96" class="box"/>
  <text x="545" y="298" class="head">Validation</text>
  <text x="545" y="329" class="muted">scores, AUC, TPR, FPR</text>
  <path d="M 438 308 L 512 308" class="arrow"/>

  <rect x="840" y="260" width="230" height="96" class="box"/>
  <text x="865" y="298" class="head">Deployment</text>
  <text x="865" y="329" class="muted">R caret -> sklearn -> ONNX</text>
  <path d="M 758 308 L 832 308" class="arrow"/>
</svg>
